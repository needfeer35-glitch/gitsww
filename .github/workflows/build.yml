name: Build Fabric Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Забираем код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java (Minecraft 1.21.x → Java 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Даем права gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 4. Кэш Gradle (ускоряет сборку)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 5. Сборка
      - name: Build with Gradle
        run: ./gradlew build

      # 6. Загружаем jar как artifact
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AutoCraft-Mod
          path: build/libs/*.jar
