name: Build AutoCraft JAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установить Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Дать права на gradlew
        run: chmod +x ./gradlew

      - name: Собрать JAR
        run: ./gradlew build

      - name: Загрузить JAR как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: autocraft-jar
          path: build/libs/autocraft-*.jar
          if-no-files-found: error
