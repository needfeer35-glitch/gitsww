name: Build AutoCraft JAR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Установить Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Собрать JAR
        run: gradle build --no-daemon --stacktrace

      - name: Показать результат сборки
        run: ls -la build/libs/

      - name: Загрузить JAR
        uses: actions/upload-artifact@v4
        with:
          name: autocraft-2.0.0
          path: build/libs/autocraft-2.0.0.jar
          if-no-files-found: error
